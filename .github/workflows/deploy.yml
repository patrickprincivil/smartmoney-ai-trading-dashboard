
name: Deploy Flask API and Static Dashboard

on:
  push:
    branches:
      - main

jobs:
  deploy-flask:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd backend-flask
          pip install flask flask-cors

      - name: Run Flask server (dev only)
        run: |
          cd backend-flask
          nohup python app.py &

  deploy-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend
